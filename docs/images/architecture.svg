<svg width="100%" viewBox="0 0 680 720" role="img" xmlns="http://www.w3.org/2000/svg">
<title>CDC Real-time eCommerce Pipeline Architecture</title>
<desc>Architecture overview showing data flow from PostgreSQL through Kafka to DuckDB and Streamlit dashboard</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    .th { font-size: 14px; font-weight: 500; fill: #1a1a1a; }
    .ts { font-size: 12px; font-weight: 400; fill: #5f5e5a; }
    .label { font-size: 11px; font-weight: 400; fill: #888780; }
  </style>
</defs>

<!-- Background -->
<rect width="680" height="720" fill="#ffffff" rx="12"/>

<!-- Layer labels -->
<text class="label" x="36" y="108" text-anchor="middle">Source</text>
<text class="label" x="36" y="248" text-anchor="middle">Capture</text>
<text class="label" x="36" y="388" text-anchor="middle">Transport</text>
<text class="label" x="36" y="528" text-anchor="middle">Sink</text>
<text class="label" x="36" y="648" text-anchor="middle">Serve</text>

<!-- Divider lines -->
<line x1="68" y1="160" x2="640" y2="160" stroke="#d3d1c7" stroke-width="0.5" stroke-dasharray="4 4"/>
<line x1="68" y1="300" x2="640" y2="300" stroke="#d3d1c7" stroke-width="0.5" stroke-dasharray="4 4"/>
<line x1="68" y1="440" x2="640" y2="440" stroke="#d3d1c7" stroke-width="0.5" stroke-dasharray="4 4"/>
<line x1="68" y1="580" x2="640" y2="580" stroke="#d3d1c7" stroke-width="0.5" stroke-dasharray="4 4"/>

<!-- ── SOURCE LAYER ── -->
<!-- Data Generator (gray) -->
<rect x="80" y="76" width="160" height="56" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text class="th" x="160" y="98" text-anchor="middle" dominant-baseline="central" fill="#2c2c2a">Data generator</text>
<text class="ts" x="160" y="118" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">mock_data/generator.py</text>

<!-- PostgreSQL (teal) -->
<rect x="300" y="76" width="180" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text class="th" x="390" y="98" text-anchor="middle" dominant-baseline="central" fill="#085041">PostgreSQL 15</text>
<text class="ts" x="390" y="118" text-anchor="middle" dominant-baseline="central" fill="#0f6e56">WAL logical replication</text>

<!-- Arrow: Generator -> Postgres -->
<line x1="240" y1="104" x2="298" y2="104" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ── CAPTURE LAYER ── -->
<!-- Kafka Connect + Debezium (purple) -->
<rect x="220" y="216" width="260" height="56" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
<text class="th" x="350" y="238" text-anchor="middle" dominant-baseline="central" fill="#3c3489">Kafka Connect + Debezium</text>
<text class="ts" x="350" y="258" text-anchor="middle" dominant-baseline="central" fill="#534ab7">ecommerce-cdc-connector</text>

<!-- Arrow: Postgres -> Kafka Connect -->
<line x1="390" y1="132" x2="390" y2="214" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="label" x="410" y="178" text-anchor="start">pgoutput</text>

<!-- Connector setup (gray) -->
<rect x="490" y="216" width="140" height="56" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text class="th" x="560" y="238" text-anchor="middle" dominant-baseline="central" fill="#2c2c2a">Connector setup</text>
<text class="ts" x="560" y="258" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">auto-register once</text>
<line x1="490" y1="244" x2="482" y2="244" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<!-- ── TRANSPORT LAYER ── -->
<!-- Apache Kafka (purple) -->
<rect x="160" y="356" width="200" height="56" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
<text class="th" x="260" y="378" text-anchor="middle" dominant-baseline="central" fill="#3c3489">Apache Kafka</text>
<text class="ts" x="260" y="398" text-anchor="middle" dominant-baseline="central" fill="#534ab7">5 topics: cdc.ecommerce.*</text>

<!-- Zookeeper (gray) -->
<rect x="430" y="356" width="150" height="56" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text class="th" x="505" y="378" text-anchor="middle" dominant-baseline="central" fill="#2c2c2a">Zookeeper</text>
<text class="ts" x="505" y="398" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">cluster coordinator</text>

<!-- Arrow: Debezium -> Kafka -->
<line x1="330" y1="272" x2="280" y2="354" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- Arrow: Zookeeper <-> Kafka (dashed) -->
<line x1="430" y1="384" x2="362" y2="384" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<!-- ── SINK LAYER ── -->
<!-- DuckDB Sink (amber) -->
<rect x="160" y="496" width="200" height="56" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="0.5"/>
<text class="th" x="260" y="518" text-anchor="middle" dominant-baseline="central" fill="#633806">DuckDB sink</text>
<text class="ts" x="260" y="538" text-anchor="middle" dominant-baseline="central" fill="#854f0b">consumers/sink_duckdb.py</text>

<!-- Kafka UI (gray) -->
<rect x="430" y="496" width="150" height="56" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text class="th" x="505" y="518" text-anchor="middle" dominant-baseline="central" fill="#2c2c2a">Kafka UI</text>
<text class="ts" x="505" y="538" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">monitoring :8080</text>

<!-- Arrow: Kafka -> Sink -->
<line x1="260" y1="412" x2="260" y2="494" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- Arrow: Kafka -> Kafka UI (dashed) -->
<line x1="430" y1="524" x2="362" y2="524" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<!-- analytics.db (amber) -->
<rect x="220" y="594" width="160" height="44" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="0.5"/>
<text class="th" x="300" y="611" text-anchor="middle" dominant-baseline="central" fill="#633806">analytics.db</text>
<text class="ts" x="300" y="629" text-anchor="middle" dominant-baseline="central" fill="#854f0b">named Docker volume</text>

<!-- Arrow: Sink -> analytics.db -->
<line x1="260" y1="552" x2="280" y2="592" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ── SERVE LAYER ── -->
<!-- Streamlit (teal) -->
<rect x="160" y="650" width="200" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text class="th" x="260" y="672" text-anchor="middle" dominant-baseline="central" fill="#085041">Streamlit dashboard</text>
<text class="ts" x="260" y="692" text-anchor="middle" dominant-baseline="central" fill="#0f6e56">dashboard/app.py :8501</text>

<!-- Slack (gray) -->
<rect x="430" y="650" width="150" height="56" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text class="th" x="505" y="672" text-anchor="middle" dominant-baseline="central" fill="#2c2c2a">Slack alert</text>
<text class="ts" x="505" y="692" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">low stock notify</text>

<!-- Arrow: analytics.db -> Streamlit -->
<line x1="300" y1="638" x2="275" y2="648" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- Arrow: Streamlit -> Slack (dashed) -->
<line x1="360" y1="678" x2="428" y2="678" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

</svg>
